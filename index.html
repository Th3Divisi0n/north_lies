<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>North Lies</title>
<style>
  body {
    background-color: #000000;
    color: #cccccc;
    font-family: "Courier New", Courier, monospace;
    text-align: center;
    padding-top: 60px;
    margin: 0;
  }
  .text {
    max-width: 600px;
    margin: 0 auto;
    font-size: 18px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #b3b3b3;
  }
  hr {
    width: 300px;
    border: none;
    border-top: 1px solid #444444;
    margin: 40px auto;
  }
  .timer-label {
    font-size: 14px;
    color: #666666;
    margin-bottom: 10px;
  }
  .timer {
    font-size: 28px;
    color: #999999;
    letter-spacing: 2px;
  }
  .credit {
    margin-top: 60px;
    font-size: 12px;
    color: #444444;
  }
</style>
</head>
<body>

<div class="text">There is two stars. not one.
The one that crashes people is the north star.
the star that is alive- the star is that Astraeus, that is.. south.

Skylark_09 looked south.

North Lies.
North_LIES</div>

<hr>

<div class="timer-label">TIME REMAINING (August 13th, 5PM EST)</div>
<div class="timer" id="countdown">--:--:--:--</div>

<div class="credit">by Mojang</div>

<script>
  var target = new Date("August 13, 2026 17:00:00 EST").getTime();

  var interval = setInterval(function() {
    var now = new Date().getTime();
    var distance = target - now;

    if (distance < 0) {
      clearInterval(interval);
      document.getElementById("countdown").innerHTML = "00:00:00:00";
      return;
    }

    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
      String(days).padStart(2, '0') + ":" +
      String(hours).padStart(2, '0') + ":" +
      String(minutes).padStart(2, '0') + ":" +
      String(seconds).padStart(2, '0');
  }, 1000);
</script>

</body>
</html>
